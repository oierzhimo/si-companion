name: Si Companion macOS & iOS Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag to attach built macOS & iOS artifacts"
        required: false
        default: "v2.1.2"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build Mac mini (macOS Apple Silicon arm64)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: si-desktop-pet/requirements-build.txt

      - name: Install build dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r si-desktop-pet/requirements-build.txt

      - name: Build, test, smoke-check, and package macOS DMG/ZIP
        run: |
          chmod +x si-desktop-pet/tools/build_macos.sh si-desktop-pet/start_macos.command
          bash si-desktop-pet/tools/build_macos.sh

      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SiDesktopPet-macOS-arm64
          path: |
            si-desktop-pet/release/SiDesktopPet-*-macOS-*.dmg
            si-desktop-pet/release/SiDesktopPet-*-macOS-*.zip
            si-desktop-pet/release/SHA256SUMS-*-macOS-*.json
            si-desktop-pet/qa/smoke-macos-*.json

      - name: Attach macOS packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ -n "$TAG" && "$TAG" != "refs/heads/"* ]]; then
            gh release upload "$TAG" \
              si-desktop-pet/release/SiDesktopPet-*-macOS-*.dmg \
              si-desktop-pet/release/SiDesktopPet-*-macOS-*.zip \
              si-desktop-pet/release/SHA256SUMS-*-macOS-*.json \
              --clobber -R "${{ github.repository }}"
          fi

  verify-ios-swiftui:
    name: Verify iOS SwiftUI Core & Package Source
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Swift Package tests (SiCompanionCoreTests)
        working-directory: si-desktop-pet/mobile/ios
        run: swift test -v

      - name: Archive iOS SwiftUI source bundle
        run: |
          mkdir -p si-desktop-pet/release
          ditto -c -k --sequesterRsrc --keepParent \
            si-desktop-pet/mobile/ios \
            si-desktop-pet/release/SiCompanion-iOS-2.1.2-Source.zip

      - name: Upload iOS source artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiCompanion-iOS-Source
          path: si-desktop-pet/release/SiCompanion-iOS-2.1.2-Source.zip

      - name: Attach iOS source archive to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ -n "$TAG" && "$TAG" != "refs/heads/"* ]]; then
            gh release upload "$TAG" \
              si-desktop-pet/release/SiCompanion-iOS-2.1.2-Source.zip \
              --clobber -R "${{ github.repository }}"
          fi
